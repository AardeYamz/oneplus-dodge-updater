<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dodge Toolbox</title>
  <script src="theme/yl-theme.js"></script>
  <link rel="stylesheet" href="theme/yl-fonts.css">
  <link rel="stylesheet" href="theme/yl-theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="yl-head compact">
    <a class="yl-brand" href="#" aria-label="Dodge Toolbox" data-yl-logo></a>
    <h1 class="yl-title">Dodge Toolbox <span class="yl-ver">OnePlus 13 · LineageOS</span></h1>
    <div class="status">
      <span id="state" class="pill">unknown</span>
      <span id="info"></span>
      <button id="latest" class="yl-btn filled" title="Ask the LineageOS API for the newest nightly">Get latest build</button>
      <button id="refresh" class="yl-btn">Refresh</button>
    </div>
    <button type="button" class="yl-theme-toggle" data-yl-theme-toggle></button>
  </header>

  <main>
    <section class="left">
      <div class="row autorun">
        <button id="autorun" class="filled">Autorun all steps</button>
        <label>from <select id="from"></select></label>
      </div>
      <ol id="steps"></ol>

      <details class="box">
        <summary>Quick actions</summary>
        <div class="row">
          <button data-reboot="system">Reboot system</button>
          <button data-reboot="bootloader">Reboot bootloader</button>
          <button data-reboot="recovery">Reboot recovery</button>
        </div>
        <form id="custom" class="row">
          <input id="line" placeholder="adb devices -l   /   fastboot getvar current-slot" autocomplete="off">
          <button type="submit">Run</button>
        </form>
        <div class="row">
          <button id="runScript">Run scripts\update-lineage.ps1 in PowerShell</button>
          <button id="openRoot">Open folder</button>
        </div>
      </details>

      <details class="box">
        <summary>Settings</summary>
        <div id="settings"></div>
      </details>
    </section>

    <section class="right">
      <div id="progress" hidden><div class="bar"><div id="fill"></div></div><span id="ptext"></span></div>
      <pre id="log"></pre>
      <div class="row">
        <button id="cancel" class="danger" disabled>Cancel</button>
        <button id="clear">Clear log</button>
      </div>
    </section>
  </main>
  <script src="bridge.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
