# Weekly, grouped (one PR per ecosystem per week), with a 7-day cooldown on new releases. Patch and minor updates that pass
# CI are merged by .github/workflows/dependabot-auto-merge.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /toolbox
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
