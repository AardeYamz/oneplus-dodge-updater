name: CI

# Lint and scan entry point: diagram lint (mermaid), actionlint, zizmor, CodeQL and dependency review, from the shared workflow in AardeYamz/workflows.
# The Windows/Rust build and tests stay in build.yml. Check names are `ci / <job>`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read     # lists a PR's changed files
      security-events: write  # zizmor and CodeQL upload SARIF to code scanning
      actions: read
    uses: AardeYamz/workflows/.github/workflows/ci.yml@b2ce6116c460e3911d9961f62f167547ee85981d # v1.4.0
    with:
      codeql: true
      codeql-languages: actions,javascript-typescript,rust
      dependency-review: true
      dependency-review-severity: high
