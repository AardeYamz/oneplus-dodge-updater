name: CI

# Lint-only entry point: diagram lint (mermaid), actionlint and zizmor, from the shared workflow in AardeYamz/workflows.
# The Windows/Rust build and tests stay in build.yml. Check names are `ci / <job>`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read     # lists a PR's changed files
      security-events: write  # the shared workflow asks for it (SARIF upload), though it is off here
      actions: read
    uses: AardeYamz/workflows/.github/workflows/ci.yml@756b83b3d2dd16a88863d2bb8aaf03a90b72c6b7 # v1.2.7
    with:
      zizmor-advanced-security: false  # private repo without code scanning
