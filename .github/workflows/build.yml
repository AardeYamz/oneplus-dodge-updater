name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push supersedes the running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, exe: dodge-toolbox.exe }
          # Linux uses the home runner when the RUNNER variable is set (yl-home); the Windows job needs windows-latest.
          - { name: linux, os: "${{ vars.RUNNER || 'ubuntu-latest' }}", exe: dodge-toolbox }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TMPDIR: ${{ runner.temp }}   # /tmp is noexec on the home runner; rustup and build scripts need to execute from temp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system libraries
        if: runner.os == 'Linux' && !vars.RUNNER
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - name: Install Rust (the home runner image has none; hosted images do)
        shell: bash
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: toolbox
      - name: Test
        run: cargo test --manifest-path toolbox/Cargo.toml --profile fast
      - name: Build
        run: cargo build --manifest-path toolbox/Cargo.toml --profile fast
      # The script helpers run against stub adb/fastboot; PowerShell 7 on both OSes, Windows PowerShell 5.1 as well on Windows.
      - name: Test script helpers (PowerShell 7)
        if: runner.os == 'Windows' || !vars.RUNNER   # the home runner image has no pwsh
        shell: pwsh
        run: ./scripts/test-helpers.ps1
      - name: Test script helpers (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-helpers.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dodge-toolbox-${{ matrix.name }}
          path: toolbox/target/fast/${{ matrix.exe }}
