name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: toolbox
      - name: Test
        run: cargo test --manifest-path toolbox/Cargo.toml --profile fast
      - name: Build
        run: cargo build --manifest-path toolbox/Cargo.toml --profile fast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dodge-toolbox
          path: toolbox/target/fast/dodge-toolbox.exe
